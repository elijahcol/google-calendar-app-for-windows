<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #wrap { width: 256px; height: 256px; }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div id="wrap"></div>
  <script>
    const { renderIconSVG } = require('./iconTemplate.js');
    const day = new Date().getDate();
    document.getElementById('wrap').innerHTML = renderIconSVG(day);
    document.title = 'icon-ready';
  </script>
</body>
</html>
